<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JULIA — Portfolio</title>
<meta name="description" content="AI 하이패션 에디토리얼 프로젝트 — 영상과 포트폴리오 PDF를 이어붙인 전용 페이지.">
<link rel="stylesheet" href="css/portfolio-page.css">
</head>
<body>

<main class="pf-page">
  <div class="pf-video-section pf-full-bleed">
    <div class="pf-video-inner">
      <video class="pf-media" autoplay muted loop playsinline disablePictureInPicture disableRemotePlayback
        aria-label="브랜드 제품 런칭 영상 — 디스토피아: 달과 회복 컨셉의 하이패션 필름">
        <source src="assets/documents/portfolio2-video.mp4" type="video/mp4">
      </video>
    </div>
  </div>
  <img class="pf-media pf-full-bleed" src="assets/documents/portfolio2-pages/page-1.jpg" alt="포트폴리오 PDF 1페이지 — 브랜드 제품 런칭 영상 제작 프로젝트 소개">
  <img class="pf-media pf-full-bleed" src="assets/documents/portfolio2-pages/page-2.jpg" alt="포트폴리오 PDF 2페이지">
</main>

<script>
  const v = document.querySelector('.pf-media[autoplay]');
  if (v) {
    v.play().catch(() => {});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) v.play().catch(() => {});
    });
  }
</script>
</body>
</html>
